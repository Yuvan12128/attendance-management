spring:
  datasource:
    url: jdbc:mysql://localhost:3306/attendance_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-long-secret-key}
    expiration-ms: 86400000
